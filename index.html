<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 專注播放器</title>
    <!-- 引入 Tailwind CSS 以快速且美觀地進行樣式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .video-container {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            /* 確保在較矮的螢幕上不會超出畫面，並自動縮小寬度以維持 16:9 */
            max-height: calc(100vh - 4rem);
            width: min(100%, calc((100vh - 4rem) * 16 / 9));
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-[#F9F1E2] min-h-screen text-[#4A3B32] antialiased selection:bg-[#C8915C]/30">

    <div id="input-view" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="bg-[#FFFDF9] rounded-2xl shadow-xl w-full max-w-md p-8 text-center transition-all duration-300 border border-[#E8DCC4]">
            <!-- 裝飾用圖示 -->
            <div class="mx-auto bg-[#C8915C]/10 text-[#C8915C] w-16 h-16 flex items-center justify-center rounded-full mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-8 h-8">
                    <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"></path>
                </svg>
            </div>
            
            <h1 class="text-2xl font-bold mb-2 text-[#4A3B32]">Youtube 專注播放器</h1>
            <p class="text-[#7A6652] text-sm mb-6">貼上 YouTube 網址，為您產生無干擾的觀看環境</p>
            
            <!-- 輸入框與按鈕 -->
            <div class="space-y-4">
                <div>
                    <input type="text" id="yt-input" 
                        class="w-full px-4 py-3 border border-[#D8C7B2] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C8915C] focus:border-[#C8915C] transition-shadow text-[#4A3B32] placeholder-[#A89885]" 
                        placeholder="請輸入 YouTube 網址... ">
                </div>
                <button id="generate-btn" 
                    class="w-full bg-[#C8915C] hover:bg-[#B37D4A] text-white font-semibold py-3 px-4 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2">
                    產生專注連結
                </button>
            </div>

            <!-- 錯誤提示訊息區塊 -->
            <div id="error-message" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
                <span>無法解析此網址，請確認是否為有效的 YouTube 連結。</span>
            </div>
        </div>
    </div>

    <!-- 背景設定維持黑箱效果 bg-black/90，周圍留白 p-4 md:p-8 確保任何情況下都有邊框 -->
    <div id="lightbox-view" class="hidden fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50 backdrop-blur-sm p-4 md:p-8">
        
        <!-- 關閉按鈕 -->
        <button id="close-btn" class="absolute top-4 right-4 md:top-8 md:right-8 text-white/50 hover:text-white bg-black/40 hover:bg-black/80 p-2 rounded-full transition-all duration-200 focus:outline-none z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <!-- 影片容器 (長寬比 16:9，最大寬度 1280px，自適應視窗大小) -->
        <div class="video-container bg-black rounded-xl overflow-hidden shadow-2xl relative ring-1 ring-white/10">
            <!-- YouTube iFrame -->
            <iframe id="yt-player" class="absolute top-0 left-0 w-full h-full" 
                src="" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 取得 DOM 元素
            const inputView = document.getElementById('input-view');
            const lightboxView = document.getElementById('lightbox-view');
            const ytInput = document.getElementById('yt-input');
            const generateBtn = document.getElementById('generate-btn');
            const errorMessage = document.getElementById('error-message');
            const ytPlayer = document.getElementById('yt-player');
            const closeBtn = document.getElementById('close-btn');

            // --- 需求 1 & 2: 檢查網址參數 `?watch=VIDEO_ID` ---
            const urlParams = new URLSearchParams(window.location.search);
            const watchId = urlParams.get('watch');

            if (watchId) {
                // 如果有參數，進入黑箱播放模式 (Lightbox Mode)
                lightboxView.classList.remove('hidden');
                // 將影片 ID 帶入嵌入網址，並取消自動播放
                ytPlayer.src = `https://www.youtube.com/embed/${watchId}`;
            } else {
                // 如果沒有參數，進入輸入模式 (Input Mode)
                inputView.classList.remove('hidden');
                ytInput.focus();
            }

            // --- 需求 4: 解析 YouTube 網址擷取 11 碼影片 ID ---
            const extractYouTubeID = (url) => {
                // 這個正則表達式涵蓋了：標準 watch?v=、youtu.be/ 短網址、embed/、shorts/ 等多種格式
                const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/)([^"&?\/\s]{11})/i;
                const match = url.match(regExp);
                return (match && match[1].length === 11) ? match[1] : null;
            };

            // 處理使用者輸入的流程
            const handleInput = () => {
                const url = ytInput.value.trim();
                if (!url) return;

                const videoId = extractYouTubeID(url);

                if (videoId) {
                    // 隱藏錯誤訊息
                    errorMessage.classList.add('hidden');
                    // 自動轉跳到帶有 ?watch=影片ID 的專屬網址
                    window.location.search = `?watch=${videoId}`;
                } else {
                    // 解析失敗，顯示網頁內錯誤提示 (取代 alert)
                    errorMessage.classList.remove('hidden');
                    // 震動動畫特效
                    inputView.firstElementChild.classList.add('animate-pulse');
                    setTimeout(() => inputView.firstElementChild.classList.remove('animate-pulse'), 500);
                }
            };

            // 綁定「按鈕點擊」事件
            generateBtn.addEventListener('click', handleInput);

            // 綁定「按下 Enter 鍵」事件
            ytInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleInput();
                }
            });

            // --- 離開黑箱模式 ---
            const closeLightbox = () => {
                // 將 iframe 的 src 清空，停止背景播放
                ytPlayer.src = '';
                // 將網址參數移除，回到乾淨的基礎網址
                window.location.href = window.location.pathname; 
            };

            closeBtn.addEventListener('click', closeLightbox);
            
            // 按下 ESC 鍵也可以關閉
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !lightboxView.classList.contains('hidden')) {
                    closeLightbox();
                }
            });
        });
    </script>
</body>
</html>
